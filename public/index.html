<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dokumen Pokja</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Arial,Helvetica,sans-serif;background:#efe7df;color:#111}
button,input,select,textarea{font-family:Arial,Helvetica,sans-serif;font-size:14px}
h1{font-size:40px;font-weight:400;margin:0 0 16px;letter-spacing:-.5px}h3{margin:0 0 12px;font-weight:400;font-size:18px}
.frame{display:grid;grid-template-columns:250px 1fr;gap:14px;padding:16px;min-height:100vh}
aside{display:flex;flex-direction:column;gap:3px;position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto}
.prof{background:#fff;border:1px solid #e6dfd8;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;margin-bottom:8px}.prof small{display:block;color:#777;font-size:11px}
aside>input{background:#e6e1dc;border:0;border-radius:12px;padding:11px 13px;margin-bottom:6px}
aside h6{margin:16px 8px 4px;font-size:13px;font-weight:400;color:#444}
aside a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;cursor:pointer;color:#444}aside a:hover{background:#ffffff80}
aside a.on{background:#fff;border:1px solid #e6dfd8;color:#000;box-shadow:0 1px 3px #0001}aside a i{width:18px;font-style:normal;text-align:center}
.cl{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.dot{width:12px!important;height:12px;border-radius:4px;background:#74b816}
.av{background:#111;color:#fff;border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.main{background:#fbfaf8;border:1px solid #e6dfd8;border-radius:18px;padding:22px 26px;min-width:0}
.btn{border:1px solid #d9d3cc;background:#fff;border-radius:9px;padding:7px 13px;cursor:pointer}.btn.p{background:#111;color:#fff;border-color:#111}.btn.s{padding:3px 10px;font-size:12px}
.card,.panel{background:#f8f6f3;border:1px solid #eee8e2;border-radius:14px;padding:16px;margin-top:14px}.card{background:#fff;margin-top:0;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:700;color:#333;margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid #d9d3cc;border-radius:9px;padding:8px 10px;background:#fff}textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.muted{color:#777;font-size:12px}.err{color:#b91c1c;font-size:13px;margin-top:8px}
.auth{max-width:380px;margin:8vh auto}.auth .card{padding:22px}
.hg{display:grid;grid-template-columns:1fr 290px;gap:16px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cd{background:#fff;border:1px solid #eee8e2;border-radius:14px;padding:16px;box-shadow:0 0 0 4px #f5f1ed}.cd b{font-weight:400;font-size:15px}.cd p{margin:6px 0 12px;color:#666;font-size:12px;min-height:48px}
.ic{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#111;color:#fff;font-style:normal;margin-bottom:14px}
.fold{display:flex;gap:18px;flex-wrap:wrap}.fold div{width:96px;text-align:center;font-size:12px;cursor:pointer}.fold i{display:block;height:56px;background:linear-gradient(#b0b0b0,#8d8d8d);border-radius:6px 6px 8px 8px;margin-bottom:6px;box-shadow:0 2px 4px #0003}
.it{background:#fff;border:1px solid #eee8e2;border-radius:12px;padding:10px 12px;margin-bottom:10px}.it small{display:block;color:#777;font-size:11px}.it div{margin-top:6px}
.wrap{display:grid;grid-template-columns:430px 1fr;gap:16px;height:calc(100vh - 66px)}
.form{background:#fff;border:1px solid #eee8e2;border-radius:14px;overflow:auto;padding:16px 18px}.form h2{margin:0}
.bar{position:sticky;bottom:-16px;background:#fff;padding:12px 0;margin-top:14px;border-top:1px solid #eee;display:flex;gap:8px}
.prev{overflow:auto;padding:4px;background:#e9e4de;border-radius:14px}
.kt{width:100%;border-collapse:collapse}.kt th{font-size:11px;text-align:left}.kt td{padding:2px;vertical-align:top}.kt textarea{min-height:44px;font-size:12px;padding:5px}.kt input{font-size:12px;padding:5px}
.set{display:grid;grid-template-columns:200px 1fr;gap:20px}.set .t{padding:9px 11px;border-radius:9px;cursor:pointer}.set .t.on{background:#111;color:#fff}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row img{height:44px;max-width:120px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/10px 10px;border:1px dashed #cbd2de}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:12px auto;padding:18mm 20mm 20mm 25mm;box-shadow:0 2px 8px #0003;font:12pt/1.4 Arial,Helvetica,sans-serif;color:#000;zoom:.78}
.kop{display:flex;gap:14px;align-items:center;border-bottom:4px double #2b3f8c;padding-bottom:6px;margin-bottom:22px}.kop img{height:84px}.kop .x{text-align:center;flex:1;color:#2b3f8c;font-size:7.5pt;line-height:1.3}.kop .x b{display:block;font-size:12pt}.kop .x i{display:block;font:normal 16pt Arial}
.sheet table.hd td{vertical-align:top;padding:0 4px 0 0}.sheet p{margin:8px 0;text-align:justify}.sheet .tc{text-align:center;font-weight:700}.sheet ol{margin:4px 0;padding-left:26px;text-align:justify}.sheet h4{margin:14px 0 4px;font-size:12pt}
.sheet table.b{border-collapse:collapse;width:100%}.sheet table.b td,.sheet table.b th{border:1px solid #000;padding:3px 6px;vertical-align:top}.sheet table.kk td,.sheet table.kk th{font-size:9pt}
.sheet table.k td{vertical-align:top;padding:2px 6px 2px 0}.ttd{margin-left:55%;text-align:center;margin-top:18px;break-inside:avoid}.ttd img{display:block;margin:4px auto;max-width:none}
.pb{break-after:page}
@media screen and (max-width:1000px){.frame{grid-template-columns:1fr}aside{position:static;height:auto}.hg,.wrap,.set{grid-template-columns:1fr;height:auto}.cards{grid-template-columns:1fr 1fr}.prev{display:none}}
@page{size:A4;margin:20mm 20mm 20mm 25mm}
@media print{body{background:#fff}aside,.form,.noprint,.set,.auth,h1{display:none!important}.frame{display:block;padding:0}.main{border:0;padding:0;background:#fff}.wrap{display:block;height:auto}.prev{padding:0;overflow:visible;background:none}.sheet{zoom:1;box-shadow:none;margin:0;padding:0;width:auto;min-height:0}}
</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
