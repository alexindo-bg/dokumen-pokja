<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dokumen Pokja</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#e8ecf1;color:#111827}
button,input,select,textarea{font:inherit}
header{background:#172b5a;color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;height:46px;position:sticky;top:0;z-index:5}
header b{font-size:15px;margin-right:auto;display:flex;gap:10px;align-items:center}.lg{width:26px;height:26px;border-radius:7px;background:#f2b928;display:inline-block}
header a{color:#cbd5e1;cursor:pointer;padding:6px 10px;border-radius:7px}header a.on{background:#25407f;color:#fff;font-weight:600}
.av{background:#f2b928;color:#172b5a;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:700;font-size:12px}
.btn{border:1.5px solid #d3d9e3;background:#fff;border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer}.btn.p{background:#172b5a;color:#fff;border-color:#172b5a}.btn.s{padding:4px 9px;font-size:12px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px #0001}.card h3{margin:0 0 12px}
label{display:block;font-size:12px;font-weight:600;color:#374151;margin:10px 0 4px}
input,select,textarea{width:100%;border:1.5px solid #d3d9e3;border-radius:9px;padding:8px 10px;background:#fff}textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.muted{color:#6b7280;font-size:12px}
.auth{max-width:380px;margin:8vh auto}.err{color:#b91c1c;font-size:13px;margin-top:8px}
.wrap{display:grid;grid-template-columns:210px 400px 1fr;height:calc(100vh - 46px)}
.side{background:#f3f5f9;padding:16px 12px;overflow:auto}.side h6{margin:6px 8px;font-size:11px;letter-spacing:.06em;color:#6b7280}
.side .t{padding:9px 11px;border-radius:9px;cursor:pointer;margin-bottom:3px}.side .t.on{background:#172b5a;color:#fff;font-weight:600}
.rec{padding:8px 10px;border-radius:9px;font-size:12px;cursor:pointer}.rec:hover,.rec.on{background:#e4e9f3}.rec b{display:block}
.form{background:#fff;overflow:auto;padding:16px 18px}.form h2{margin:0}
.chips span{display:inline-block;border:1.5px solid #d3d9e3;border-radius:99px;padding:4px 11px;margin:0 5px 5px 0;cursor:pointer}.chips span.on{background:#172b5a;color:#fff;border-color:#172b5a}
.bar{position:sticky;bottom:-16px;background:#fff;padding:12px 0;margin-top:14px;border-top:1px solid #e5e7eb;display:flex;gap:8px}
.prev{overflow:auto;padding:18px}.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto 18px;padding:18mm 20mm 20mm 25mm;box-shadow:0 2px 8px #0003;font:12pt/1.4 "Liberation Sans",Arial,Helvetica,sans-serif;color:#000;zoom:.78}
.set{display:grid;grid-template-columns:200px 1fr;gap:20px;max-width:980px;margin:24px auto}.set .t{padding:9px 11px;border-radius:9px;cursor:pointer}.set .t.on{background:#172b5a;color:#fff}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0f4}.row img{height:44px;max-width:120px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/10px 10px;border:1px dashed #cbd2de}
.kop{display:flex;gap:14px;align-items:center;border-bottom:4px double #2b3f8c;padding-bottom:6px;margin-bottom:22px}.kop img{height:84px}.kop .x{text-align:center;flex:1;color:#2b3f8c;font-size:7.5pt;line-height:1.3}.kop .x b{display:block;font-size:12pt}.kop .x i{display:block;font:normal 16pt Arial}
.sheet table.hd td{vertical-align:top;padding:0 4px 0 0}.sheet p{margin:8px 0;text-align:justify}.sheet ol{margin:4px 0;padding-left:26px;text-align:justify}.sheet h4{margin:14px 0 4px;font-size:12pt}
.sheet table.b{border-collapse:collapse;width:100%}.sheet table.b td,.sheet table.b th{border:1px solid #000;padding:3px 6px;vertical-align:top}
.sheet table.k td{vertical-align:top;padding:2px 6px 2px 0}.ttd{margin-left:55%;text-align:center;margin-top:18px;break-inside:avoid}.ttd img{max-height:60px;max-width:150px;display:block;margin:2px auto}
.tc{text-align:center;font-weight:700}.pb{break-after:page}
@media screen and (max-width:1000px){.wrap{grid-template-columns:1fr;height:auto}.side{display:flex;flex-wrap:wrap}.prev{display:none}}
@page{size:A4;margin:20mm 20mm 20mm 25mm}
@media print{body{background:#fff}header,.wrap>:not(.prev),.set,.auth,.noprint{display:none!important}.wrap{display:block;height:auto}.prev{padding:0;overflow:visible}.sheet{zoom:1;box-shadow:none;margin:0;padding:0;width:auto;min-height:0}}
</style></head><body><div id="app"></div><script src="/app.js"></script></body></html>
